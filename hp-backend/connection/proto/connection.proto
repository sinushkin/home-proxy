syntax = "proto3";

package hp_backend.connection;

// Точка встречи: адрес слота. О bootstrap-слоте (0) договариваемся через MQTT
// (`home-proxy/rendezvous/{peer_id}/{slot}`), об остальных — тем же самым
// сообщением, но отправленным напрямую по уже пробитой дыре (в `Lite`,
// «виртуал-брокер»).
message Rendezvous {
  string public_ip = 1;
  uint32 public_port = 2;
  string peer_id = 3;
  uint64 registered_at_unix_ms = 4;
  string session_id = 5;
  uint32 slot = 6;
  // 16 случайных байт: побайтовый XOR-вектор (циклически), которым пир должен
  // кодировать всё, что шлёт нам по этой дыре. Новый на каждую регистрацию слота.
  bytes key = 7;
  // Другие внешние адреса того же сокета. Разные STUN-серверы могут видеть один
  // сокет по-разному (разные маршруты, NAT с адресом, зависящим от адресата);
  // пир стучится по основному адресу (`public_ip`/`public_port`) и по этим.
  repeated Endpoint extra_endpoints = 8;
}

// Внешний адрес, увиденный STUN-сервером.
message Endpoint {
  string ip = 1;
  uint32 port = 2;
}

// Верхний конверт всего, что летит между пирами по UDP.
message PeerMessage {
  oneof body {
    // Пробив дыры: нужна полная идентичность — дыра ещё не установлена.
    InitMessage init = 1;
    // Всё после установки дыры: идентичность уже известна из пробива,
    // поэтому нужен только `slot` (короткий заголовок — меньше сигнатура).
    Lite lite = 2;
  }
}

// Сообщение фазы пробива. Несёт полный GUID-конверт: получатель по нему
// отличает настоящий пакет пира от вернувшегося к себе (hairpin) и от
// постороннего.
message InitMessage {
  string session_id = 1;
  string from_peer_id = 2;
  string to_peer_id = 3;
  uint32 slot = 4;
  oneof payload {
    Punch punch = 5;
    PunchAck punch_ack = 6;
  }
}

// Сообщение после установки дыры. Идентичность подтверждена пробивом, поэтому
// принимается только с уже подтверждённого адреса дыры — GUID не нужен.
message Lite {
  uint32 slot = 1;
  oneof payload {
    KeepAlive keep_alive = 2;
    Data data = 3;
    Stats stats = 4;
    DeleteLink delete_link = 5;
    // Виртуал-брокер: тот же `Rendezvous`, что ушёл бы в MQTT, но отправленный
    // напрямую по этой дыре — чтобы договориться о других слотах без брокера.
    Rendezvous rendezvous = 6;
    // Пакет, обёрнутый роутером (см. `WrappedData`).
    WrappedData wrapped = 7;
  }
}

// Роутер держит набор дыр к серверу и по набору к каждому телефону. Обычную
// `Data` от телефона он оборачивает в `WrappedData` (с номером этого телефона) и
// отправляет серверу; `WrappedData` от сервера разворачивает и по `client_id`
// отдаёт нужному телефону обычной `Data`. Так роутеру не нужен ни WireGuard, ни
// знание содержимого пакета.
message WrappedData {
  // Порядковый номер пакета (отдельный счётчик на каждого клиента и
  // направление): по нему получатель видит потери и перестановки между дырами.
  uint64 seq = 1;
  // Исходный пакет как есть (например, датаграмма WireGuard).
  bytes payload = 2;
  // Номер клиента (телефона), 0..=255 (в коде u8). Его присваивает роутер, сервер
  // отвечает с тем же номером и по нему заводит клиенту свой локальный сокет.
  uint32 client_id = 3;
}

message Punch {
  uint32 target_port = 1;
}

message PunchAck {
  uint32 target_port = 1;
}

message KeepAlive {
  uint64 seq = 1;
}

// Полезная нагрузка поверх дыры (в перспективе — зашифрованный WireGuard).
message Data {
  bytes payload = 1;
}

// Статистика отправителя по всем его живым дырам (сколько отправил/получил).
message Stats {
  repeated LinkStat links = 1;
}

message LinkStat {
  uint32 slot = 1;
  uint64 sent = 2;
  uint64 received = 3;
}

// Команда пиру: удалить линк по этой дыре (мы пробиваем её заново).
message DeleteLink {
  uint32 slot = 1;
}
