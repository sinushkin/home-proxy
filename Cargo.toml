[workspace]
resolver = "2"
members = [
    "hp-backend/connection",
    "hp-backend/peer",
    "hp-backend/logging",
    "hp-backend/client",
    "hp-backend/android-lib",
    "hp-backend/tun",
    "hp-server",
    "vps-server",
    "vps-client",
    "hp-router",
]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
prost = "0.13"
prost-build = "0.13"
rumqttc = "0.24"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
# Без дефолтной фичи regex (фильтр логов по тексту): фильтр по модулям в RUST_LOG остаётся,
# а regex-крейты (~четверть кода бинарника) не линкуются.
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
anyhow = "1"
libc = "0.2"
jni = "0.21"
# Без дефолтной фичи regex (как у env_logger): фильтр по модулям остаётся, размер меньше.
android_logger = { version = "0.15", default-features = false }
# Служба Windows для server (SCM: запуск, остановка, установка).
windows-service = "0.8"
# Подпись пакетов: ChaCha20-Poly1305 (шифруется пустое сообщение, пакет — присоединённые данные),
# вывод ключей из секрета пары — SHA-256, подпись `Rendezvous` — HMAC-SHA256. Без атомиков и SIMD
# под MIPS32 (роутеры) — чистый Rust.
chacha20poly1305 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
hmac = "0.12"
