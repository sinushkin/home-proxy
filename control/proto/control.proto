// Протокол управления службой (hp-server, hp-router) — трей и другие «пульты». TCP на loopback
// или в LAN, кадр: u32 big-endian длина + данные. После рукопожатия (secure.rs) каждый кадр —
// ControlMessage, зашифрованный ключом из строки подключения. См. control/README.md.
syntax = "proto3";

package hp.control;

message ControlMessage {
  oneof body {
    Hello hello = 1;
    GetStatus get_status = 2;
    Status status = 3;
    Subscribe subscribe = 4;
    // 5 — Event, 6/7 — Identity, 8 — SetPeer, 11 — Restart: зарезервированы в замысле.
    CreatePairing create_pairing = 9;
    Pairing pairing = 10;
    Welcome welcome = 12;
    Error error = 13;
    RemovePeer remove_peer = 14;
    Done done = 15;
  }
}

// Первое зашифрованное сообщение клиента. Не расшифровалось (другой ключ) — служба закрывает
// соединение.
message Hello {
  reserved 1;                // было: токен открытым текстом
  uint32 version = 2;
}

// Ответ службы на Hello.
message Welcome {
  uint32 version = 1;
  string service = 2;  // "hp-server" | "hp-router"
  string build = 3;    // версия пакета
}

message GetStatus {}

// Присылать Status раз в interval_ms (0 — прекратить), пока соединение открыто.
message Subscribe {
  uint32 interval_ms = 1;
}

message Status {
  string service = 1;
  uint64 uptime_s = 2;
  string mode = 3;           // tun | netstack | router
  string bind = 4;           // к чему привязаны сокеты дыр (BIND_ADDR), пусто — любой адрес
  repeated PeerStatus peers = 5;
  Traffic traffic = 6;
  bool pairing_supported = 7;
  // VPS-сервер: релеи vps-relay (приходят к серверу сами; см. connection::vps::relay).
  repeated RelayStatus relays = 8;
}

// Релей VPS-сервера.
message RelayStatus {
  string name = 1;           // первая группа GUID релея
  string addr = 2;           // порт знакомства релея для клиентов (пусто — ещё не сообщил)
  bool alive = 3;            // на связи (пакеты за последние 10 с): только такие уходят клиентам
  uint32 live = 4;           // дыр релея к серверу в работе
  repeated HoleStatus holes = 5;
  HoleCounters counters = 6;
}

// Пир (телефон или роутер). Полные GUID — секрет пары и сюда не входят, только имя.
message PeerStatus {
  string name = 1;           // первая группа GUID пира
  string state = 2;          // rendezvous | punching | connected
  uint32 live = 3;           // живых дыр
  uint32 target = 4;         // сколько держим
  repeated HoleStatus holes = 5;
  repeated string addresses = 6;  // адреса в туннеле, выданные этому пиру и клиентам за ним
  bool pending = 7;          // сопряжение ещё не завершено (телефон не подключался)
  uint64 pending_expires_unix = 8;
  bool removable = 9;         // сопряжён из трея (заданный в файле настроек удаляется только там)
  string kind = 10;          // phone | vps
  // Текущее ожидание недостающего TCP-пакета в буфере порядка (адаптивное, 3..=30 мс; 0 —
  // буфер порядка выключен, REORDER_WAIT_MS=0).
  uint32 reorder_wait_ms = 11;
  // Последняя регистрация пира на MQTT-брокере: внешний адрес его bootstrap-слота (как его
  // увидел STUN) и время по часам пира, мс Unix. Пусто/0 — записи не было (или режим без MQTT).
  string registered_addr = 12;
  uint64 registered_at_unix_ms = 13;
  // События дыр с запуска набора (только память службы) и последние из них, старые — первыми.
  HoleCounters counters = 14;
  repeated HoleEvent events = 15;
}

message HoleCounters {
  uint32 opened = 1;
  uint32 lost = 2;           // от пира нет пакетов
  uint32 drained_by_us = 3;  // мы попросили слить (политика набора, плохая, срок)
  uint32 drained_by_peer = 4;
  uint32 bad = 5;            // по статистике пира доставлено меньше половины
  uint32 not_confirmed = 6;  // пир не подтвердил путь
}

message HoleEvent {
  uint64 at_unix_ms = 1;
  uint32 slot = 2;
  string kind = 3;           // opened | lost | drained_by_us | drained_by_peer | bad | not_confirmed
  string via = 4;            // через какой релей шла дыра (пусто — напрямую)
}

message HoleStatus {
  uint32 slot = 1;
  string peer_addr = 2;
  uint64 sent = 3;
  uint64 received = 4;
  // Потери по последнему отчёту пира, доли 0..1; отрицательное — нет данных.
  float loss_out = 5;
  float loss_in = 6;
  // Сколько дыра открыта, секунд (дыры динамические: стареют и заменяются).
  uint32 age_secs = 7;
  // Дыра сливается: данные по ней уже не идут, она ещё принимает последние пакеты.
  bool draining = 8;
  // Через какой релей идёт дыра (VPS: у сервера — имя релея, у клиента — его адрес); пусто — напрямую.
  string via = 9;
}

// Пакеты: к пирам (телефонам) и от них, TCP с номером в потоке, отброшенные. У роутера ещё
// шлюз дома: LAN → VPS и VPS → LAN.
message Traffic {
  uint64 to_peers = 1;
  uint64 ordered = 2;
  uint64 from_peers = 3;
  uint64 dropped = 4;
  uint64 lan_to_vps = 5;
  uint64 vps_to_lan = 6;
}

// Добавить телефон: служба заводит новую пару GUID и её набор дыр, отвечает Pairing.
message CreatePairing {}

message Pairing {
  PairingBundle bundle = 1;
  string uri = 2;            // homeproxy://pair?d=<base64url(bundle)> — это и есть QR
  string name = 3;           // имя телефона (первая группа его GUID)
}

// Пакет сопряжения для телефона. Внутри — полные GUID пары, из них выводятся все ключи:
// показывать только по кнопке, не логировать, не хранить.
message PairingBundle {
  uint32 version = 1;
  string pc_guid = 2;        // GUID службы — PEER_ID телефона
  string phone_guid = 3;     // GUID телефона — MY_ID телефона
  string stun = 4;           // ip:порт[,ip2:порт]
  string mqtt = 5;           // ip:порт, TLS
  bytes mqtt_ca_pem = 6;
  reserved 7;                // было: конфиг WireGuard
  uint64 expires_unix = 8;
}

// Удалить пира по имени (телефон перестанет подключаться, его пара забывается).
message RemovePeer {
  string name = 1;
}

message Done {}

message Error {
  string message = 1;
}
