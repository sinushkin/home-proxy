# ACL для TLS-листенера. Общих правил `topic ...` нет — значит, всё, что не
# разрешено ниже, запрещено (в том числе $SYS/# и подписка на wildcard по
# чужим GUID).
#
# %c — client_id клиента (его собственный GUID), %u — username (GUID пира,
# которого он ищет).

# Писать (и стирать retained) можно только слоты своего GUID.
pattern write home-proxy/rendezvous/%c/+

# Читать можно только слоты искомого пира. Топик `home-proxy/rendezvous/+/+`
# или `#` клиенту недоступен, так что перечислить чужие устройства нельзя.
pattern read home-proxy/rendezvous/%u/+
