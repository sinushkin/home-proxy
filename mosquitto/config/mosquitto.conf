# Единственный внешний листенер — MQTT over TLS (8883) с ACL (см. acl.conf).
# Открытых 1883/9001 наружу нет: ключи XOR лежат в Rendezvous, им нельзя
# ходить по сети открытым текстом.
#
# Идентичность клиента: client_id = его GUID, username = GUID того, кого он
# ищет. Пароль не проверяется (нет ни password_file, ни плагина), поэтому
# allow_anonymous должен остаться true — иначе брокер отклонит всех. Всю
# «авторизацию» делает acl.conf: писать можно только в свой GUID, читать только
# GUID искомого пира, а список чужих устройств через wildcard не получить.

# Настройки (allow_anonymous, acl_file, TLS) действуют на свой листенер, а не
# глобально — иначе ACL зацепил бы и админский листенер ниже.
per_listener_settings true

listener 8883
protocol mqtt
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
tls_version tlsv1.2
allow_anonymous true
acl_file /mosquitto/config/acl.conf

# Админский листенер: слушает 127.0.0.1 ВНУТРИ контейнера, порт наружу не
# пробрасывается — достучаться можно только через `docker exec` (см.
# mosquitto/README.md). Без ACL, чтобы оператор видел всё.
listener 1883 127.0.0.1
protocol mqtt
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
