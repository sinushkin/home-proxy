# Минимальный конфиг только для STUN, для локальной отладки.
# TURN-релей и аутентификация здесь намеренно не настроены — конфиг
# максимально голый, чтобы потом легко заменить его на публичный или
# собственный STUN/TURN-сервер.

listening-port=3499
listening-ip=0.0.0.0

# Только STUN: отключаем функциональность TURN-релея.
no-tcp-relay
stun-only

# Логирование для локальной разработки.
verbose
log-file=stdout
