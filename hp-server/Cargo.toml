[package]
name = "hp-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
uuid = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
connection = { path = "../hp-backend/connection" }
hp-logging = { path = "../hp-backend/logging" }
hp-tun = { path = "../hp-backend/tun" }
hp-netstack = { path = "../hp-backend/netstack", optional = true }

[features]
default = ["netstack"]
# Свой сетевой стек (MODE=netstack): Windows и ПК без root. На роутер не нужен (hp-router — без него).
netstack = ["dep:hp-netstack"]

