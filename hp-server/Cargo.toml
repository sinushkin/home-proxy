[package]
name = "hp-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
uuid = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
connection = { path = "../hp-backend/connection" }
hp-logging = { path = "../hp-backend/logging" }
hp-tun = { path = "../hp-backend/tun" }
hp-control = { path = "../control" }
hp-netstack = { path = "../hp-backend/netstack", optional = true }
if-addrs = { workspace = true }
# Модуль статистики пакетов (hp-stats, PLAN-ML.md), опционально (фича `stats`).
hp-stats = { path = "../hp-backend/stats", optional = true }

[features]
default = ["netstack"]
# Свой сетевой стек (MODE=netstack): Windows и ПК без root. На роутер не нужен (hp-router — без него).
netstack = ["dep:hp-netstack"]
# Сбор по-пакетной статистики вниз (vps-server → клиент), см. PLAN-ML.md; не по умолчанию —
# в частности, не попадает в сборку hp-router под OpenWrt/MIPS32.
stats = ["dep:hp-stats", "connection/stats"]

