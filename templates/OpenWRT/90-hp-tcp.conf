# hp-router: TCP-буферы для туннеля с RTT ~100 мс (стартовое окно больше, верхний предел — 4 МБ)
# Установка: cp 90-hp-tcp.conf /etc/sysctl.d/ && sysctl -p /etc/sysctl.d/90-hp-tcp.conf
# Не сохраняется при sysupgrade без строки в /etc/sysupgrade.conf. См. Performance.md, раздел «Роутер OpenWrt 25.12».
net.ipv4.tcp_rmem = 4096 262144 4194304
net.ipv4.tcp_wmem = 4096 262144 4194304
